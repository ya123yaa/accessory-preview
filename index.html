<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装飾ブレスレット プレビュー</title>
<style>
  :root {
    --ink: #0B0D10; --brass: #9AA5B1; --canvas: #F3F5F7;
    --canvas-dim: #D9DEE3; --cord: #6B7480;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--ink); display: flex; justify-content: center; padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 720px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--canvas) 100%);
    border: 1px solid var(--canvas-dim); border-radius: 2px; overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.75);
  }
  .header {
    padding: 24px 28px 18px; border-bottom: 1px solid var(--canvas-dim);
    display: flex; justify-content: space-between; align-items: baseline;
    background: linear-gradient(90deg, #0B0D10 0%, #1B1F24 100%);
  }
  .eyebrow {
    font-size: 10px; letter-spacing: 0.35em; margin: 0 0 6px;
    background: linear-gradient(160deg, #FFFFFF 0%, #B7BEC7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700;
    letter-spacing: 0.01em; font-size: 22px; margin: 0;
    background: linear-gradient(160deg, #FFFFFF 0%, #E4E7EB 45%, #A9B0BA 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .sub { font-size: 10px; letter-spacing: 0.15em; color: var(--brass); }
  .body { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .body { grid-template-columns: 1.1fr 1fr; } }
  .preview-pane { padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .chain-wrap { position: relative; width: 100%; max-width: 380px; }
  .chain-wrap img.base { width: 100%; display: block; }
  .charm-slot { position: absolute; }
  .charm-slot img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); }
  .status { margin-top: 14px; font-size: 11px; color: var(--cord); text-align: center; }
  .panel { padding: 28px; border-top: 1px solid var(--canvas-dim); max-height: 720px; overflow-y: auto; }
  @media (min-width: 640px) { .panel { border-top: none; border-left: 1px solid var(--canvas-dim); } }
  .field-label { font-size: 10px; letter-spacing: 0.3em; color: var(--brass); margin: 0 0 8px; text-transform: uppercase; }
  select { width: 100%; font-size: 12px; padding: 8px 10px; border: 1px solid var(--canvas-dim); border-radius: 2px; background: #FFFFFF; color: var(--ink); margin-bottom: 16px; }
  .slot-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slot-label { font-size: 11px; color: var(--ink); width: 56px; flex-shrink: 0; }
  .slot-row select { margin-bottom: 0; }
  .price-box { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--canvas-dim); }
  .price-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--cord); margin-bottom: 6px; }
  .price-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--canvas-dim); }
  .price-total .label { font-size: 10px; letter-spacing: 0.3em; color: var(--ink); }
  .price-total .value { font-size: 28px; font-weight: 800; color: #14171B; text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
  .note { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--canvas-dim); font-size: 10px; color: var(--cord); line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <p class="eyebrow">LIVE PREVIEW</p>
      <h1 class="title">装飾ブレスレット</h1>
    </div>
    <p class="sub">全42種 実写プレビュー</p>
  </div>
  <div class="body">
    <div class="preview-pane">
      <div class="chain-wrap" id="chainWrap">
        <img class="base" id="baseImg" src="" alt="チェーン">
      </div>
      <p class="status" id="statusText">チェーンと装飾を選んでください</p>
    </div>
    <div class="panel">
      <p class="field-label">チェーンを選ぶ</p>
      <select id="chainSelect"></select>
      <p class="field-label">装飾を選ぶ(最大5個)</p>
      <div id="slotContainer"></div>
      <div class="price-box">
        <div class="price-line"><span>チェーン本体</span><span id="chainPriceText">¥0</span></div>
        <div id="charmPriceLines"></div>
        <div class="price-total">
          <span class="label">合計</span>
          <span class="value" id="totalText">¥0</span>
        </div>
      </div>
      <p class="note">※プレビュー用の仮表示です。実際のご注文は商品オプションからお選びください。同じ装飾は複数スロットで選ばないようご注意ください。</p>
    </div>
  </div>
</div>

<script>
// 画像はimages/フォルダから読み込む(base64埋め込みなし)
const IMG = id => "images/" + id + ".png";

const ANCHORS = {"c1": [48.5, 10.2], "c2": [50.4, 10.5], "c3": [49.9, 10.3], "c4": [50.7, 10.7], "c6": [53.1, 9.0], "c7": [50.3, 9.0], "c8": [41.3, 9.0], "c9": [36.6, 8.8], "c10": [28.8, 8.9], "c11": [49.8, 9.9], "c12": [48.7, 9.7], "c13": [51.8, 9.8], "c14": [48.9, 9.7], "c15": [51.2, 9.9], "c16": [49.4, 8.9], "c17": [50.1, 8.9], "c18": [49.4, 8.9], "c19": [22.3, 12.5], "c20": [48.5, 45.6], "c21": [50.2, 48.3], "c22": [47.0, 49.8], "c23": [50.3, 48.0], "c24": [46.1, 48.1], "c25": [45.1, 48.8], "c26": [50.4, 52.2], "c27": [50.5, 52.0], "c28": [50.4, 52.6], "c29": [50.5, 52.3], "c30": [50.7, 48.7], "c31": [50.4, 49.2], "c32": [50.6, 49.9], "c33": [49.6, 49.4], "c34": [50.3, 47.8], "c35": [50.8, 49.4], "c36": [50.1, 49.4], "c37": [50.1, 49.6], "c38": [50.8, 51.1], "c39": [49.5, 49.8], "c40": [52.2, 45.5], "c41": [56.9, 10.7], "c42": [49.0, 10.9], "c5": [60.9, 10.5]};
const DIMS = {"c1": [202, 420], "c2": [203, 420], "c3": [125, 420], "c4": [153, 420], "c6": [219, 420], "c7": [223, 420], "c8": [216, 420], "c9": [143, 420], "c10": [105, 420], "c11": [228, 420], "c12": [178, 420], "c13": [205, 420], "c14": [290, 420], "c15": [154, 420], "c16": [239, 420], "c17": [164, 420], "c18": [291, 420], "c19": [360, 420], "c20": [420, 390], "c21": [349, 420], "c22": [362, 420], "c23": [323, 420], "c24": [313, 420], "c25": [346, 420], "c26": [399, 419], "c27": [408, 420], "c28": [406, 420], "c29": [401, 420], "c30": [383, 420], "c31": [385, 420], "c32": [382, 420], "c33": [390, 419], "c34": [380, 420], "c35": [390, 420], "c36": [410, 420], "c37": [399, 420], "c38": [262, 420], "c39": [378, 420], "c40": [408, 420], "c41": [295, 420], "c42": [185, 420], "c5": [174, 420]};
const CHARMS = [{"id": "none", "label": "選択しない", "price": 0, "type": "none"}, {"id": "c1", "label": "てんびんチャーム", "price": 300, "type": "dangle"}, {"id": "c2", "label": "ムーンスター", "price": 300, "type": "dangle"}, {"id": "c3", "label": "ハートキー", "price": 300, "type": "dangle"}, {"id": "c4", "label": "ハートキー(小)", "price": 300, "type": "dangle"}, {"id": "c5", "label": "ローズ(黒)", "price": 300, "type": "dangle"}, {"id": "c6", "label": "ハート(唐草)", "price": 300, "type": "dangle"}, {"id": "c7", "label": "スノーフレーク", "price": 300, "type": "dangle"}, {"id": "c8", "label": "スターアウトライン", "price": 300, "type": "dangle"}, {"id": "c9", "label": "ベア", "price": 300, "type": "dangle"}, {"id": "c10", "label": "キー(渦巻き)", "price": 300, "type": "dangle"}, {"id": "c11", "label": "バタフライ", "price": 300, "type": "dangle"}, {"id": "c12", "label": "ムーン", "price": 300, "type": "dangle"}, {"id": "c13", "label": "スター", "price": 300, "type": "dangle"}, {"id": "c14", "label": "クラウン", "price": 300, "type": "dangle"}, {"id": "c15", "label": "ハートキー(装飾)", "price": 300, "type": "dangle"}, {"id": "c16", "label": "スノーフレーク(細密)", "price": 300, "type": "dangle"}, {"id": "c17", "label": "エッフェル塔", "price": 300, "type": "dangle"}, {"id": "c18", "label": "バタフライ(アウトライン)", "price": 300, "type": "dangle"}, {"id": "c19", "label": "キー&ロック", "price": 300, "type": "dangle"}, {"id": "c20", "label": "ハートパヴェ", "price": 300, "type": "spacer"}, {"id": "c21", "label": "フラワースペーサー", "price": 300, "type": "spacer"}, {"id": "c22", "label": "唐草スペーサー", "price": 300, "type": "spacer"}, {"id": "c23", "label": "パープルストーンスペーサー", "price": 400, "type": "spacer"}, {"id": "c24", "label": "フラワースペーサー(小)", "price": 300, "type": "spacer"}, {"id": "c25", "label": "スタースペーサー(ピンク)", "price": 400, "type": "spacer"}, {"id": "c26", "label": "ふたご座", "price": 350, "type": "spacer"}, {"id": "c27", "label": "やぎ座", "price": 350, "type": "spacer"}, {"id": "c28", "label": "てんびん座", "price": 350, "type": "spacer"}, {"id": "c29", "label": "うお座", "price": 350, "type": "spacer"}, {"id": "c30", "label": "いて座", "price": 350, "type": "spacer"}, {"id": "c31", "label": "おうし座", "price": 350, "type": "spacer"}, {"id": "c32", "label": "おとめ座", "price": 350, "type": "spacer"}, {"id": "c33", "label": "しし座", "price": 350, "type": "spacer"}, {"id": "c34", "label": "さそり座", "price": 350, "type": "spacer"}, {"id": "c35", "label": "おひつじ座", "price": 350, "type": "spacer"}, {"id": "c36", "label": "かに座", "price": 350, "type": "spacer"}, {"id": "c37", "label": "みずがめ座", "price": 350, "type": "spacer"}, {"id": "c38", "label": "ピンクパヴェスペーサー", "price": 400, "type": "spacer"}, {"id": "c39", "label": "ハートクラウンスペーサー", "price": 400, "type": "spacer"}, {"id": "c40", "label": "ハートパヴェスペーサー", "price": 400, "type": "spacer"}, {"id": "c41", "label": "ハートペアダングル", "price": 400, "type": "dangle"}, {"id": "c42", "label": "リボン&ピンクジェム", "price": 400, "type": "dangle"}].map(c => ({...c, img: c.id !== "none" ? IMG(c.id) : null}));

const CHAINS = [
  { id: "chain_simple", label: "シンプルチェーン", price: 1800, img: IMG("chain_simple") },
  { id: "chain_heart",  label: "ハート留め具",     price: 2200, img: IMG("chain_heart") },
  { id: "chain_adjust", label: "アジャスター付き", price: 2000, img: IMG("chain_adjust") },
];

const DANGLE_POS = [
  { x: 70.0, y: 84.0 },
  { x: 61.5, y: 90.2 },
  { x: 50.0, y: 92.0 },
  { x: 38.5, y: 89.2 },
  { x: 30.0, y: 84.3 },
];
const SPACER_POS = [
  { x: 72.0, y: 83.7 },
  { x: 65.8, y: 91.0 },
  { x: 50.0, y: 93.5 },
  { x: 34.2, y: 91.0 },
  { x: 20.6, y: 83.7 },
];
const DANGLE_HEIGHT_RATIO = 0.28;
const SPACER_HEIGHT_RATIO = 0.13;

const chainSelect = document.getElementById("chainSelect");
const baseImg = document.getElementById("baseImg");
const chainWrap = document.getElementById("chainWrap");
const slotContainer = document.getElementById("slotContainer");
const statusText = document.getElementById("statusText");
const chainPriceText = document.getElementById("chainPriceText");
const charmPriceLines = document.getElementById("charmPriceLines");
const totalText = document.getElementById("totalText");

CHAINS.forEach(c => {
  const opt = document.createElement("option");
  opt.value = c.id; opt.textContent = c.label + " (¥" + c.price.toLocaleString() + ")";
  chainSelect.appendChild(opt);
});
chainSelect.addEventListener("change", render);

const slotSelects = [];
for (let i = 1; i <= 5; i++) {
  const row = document.createElement("div"); row.className = "slot-row";
  const label = document.createElement("span"); label.className = "slot-label"; label.textContent = "装飾" + i;
  const sel = document.createElement("select");
  const noneOpt = document.createElement("option"); noneOpt.value = "none"; noneOpt.textContent = "選択しない";
  sel.appendChild(noneOpt);
  const gDangle = document.createElement("optgroup"); gDangle.label = "ぶら下げ型";
  const gSpacer = document.createElement("optgroup"); gSpacer.label = "スペーサー型";
  CHARMS.forEach(c => {
    if (c.type === "none") return;
    const opt = document.createElement("option");
    opt.value = c.id; opt.textContent = c.label + " (+¥" + c.price.toLocaleString() + ")";
    if (c.type === "dangle") gDangle.appendChild(opt); else gSpacer.appendChild(opt);
  });
  sel.appendChild(gDangle); sel.appendChild(gSpacer);
  sel.addEventListener("change", render);
  row.appendChild(label); row.appendChild(sel);
  slotContainer.appendChild(row); slotSelects.push(sel);
}

function positionCharms() {
  const rect = chainWrap.getBoundingClientRect();
  const wrapW = rect.width, wrapH = rect.height;
  chainWrap.querySelectorAll(".charm-slot").forEach(el => {
    const id = el.dataset.charmId, idx = parseInt(el.dataset.slotIdx), type = el.dataset.type;
    const [natW, natH] = DIMS[id], [ax, ay] = ANCHORS[id];
    const ratio = type === "spacer" ? SPACER_HEIGHT_RATIO : DANGLE_HEIGHT_RATIO;
    const posArr = type === "spacer" ? SPACER_POS : DANGLE_POS;
    const charmHpx = wrapH * ratio, charmWpx = charmHpx * (natW / natH);
    const pos = posArr[idx];
    el.style.width = charmWpx + "px"; el.style.height = charmHpx + "px";
    el.style.left = (wrapW*(pos.x/100) - charmWpx*(ax/100)) + "px";
    el.style.top = (wrapH*(pos.y/100) - charmHpx*(ay/100)) + "px";
    el.style.zIndex = type === "spacer" ? 5 : 10;
  });
}

function render() {
  const chain = CHAINS.find(c => c.id === chainSelect.value) || CHAINS[0];
  chainPriceText.textContent = "¥" + chain.price.toLocaleString();
  chainWrap.querySelectorAll(".charm-slot").forEach(el => el.remove());
  charmPriceLines.innerHTML = "";
  let total = chain.price, count = 0;
  const seen = {}; let dup = false;
  slotSelects.forEach((sel, idx) => {
    const c = CHARMS.find(x => x.id === sel.value);
    if (!c || c.id === "none") return;
    if (seen[c.id]) dup = true; seen[c.id] = true; count++; total += c.price;
    const wrapper = document.createElement("div"); wrapper.className = "charm-slot";
    wrapper.dataset.charmId = c.id; wrapper.dataset.slotIdx = idx; wrapper.dataset.type = c.type;
    const img = document.createElement("img"); img.src = c.img; wrapper.appendChild(img);
    chainWrap.appendChild(wrapper);
    const line = document.createElement("div"); line.className = "price-line";
    line.innerHTML = "<span>+ " + c.label + "</span><span>¥" + c.price.toLocaleString() + "</span>";
    charmPriceLines.appendChild(line);
  });
  totalText.textContent = "¥" + total.toLocaleString();
  if (count === 0) statusText.textContent = "装飾を選ぶとその場に反映されます";
  else if (dup) statusText.textContent = "⚠ 同じ装飾が重複しています";
  else statusText.textContent = count + " / 5 個選択中";
  positionCharms();
}

baseImg.addEventListener("load", positionCharms);
window.addEventListener("resize", positionCharms);
chainSelect.value = "chain_simple";
baseImg.src = CHAINS[0].img;
render();
</script>
</body>
</html>
